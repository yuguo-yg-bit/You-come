<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玉国国际金融公司全球通</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    html, body {
      background: #050508;
      background-image: radial-gradient(#1a1030 0.5px, transparent 0.5px);
      background-size: 20px 20px;
      color: #fff;
      min-height: 100vh;
      height: 100%;
      overflow-x: hidden;
    }
    /* 磨砂玻璃通用卡片 */
    .glass-card {
      background: rgba(20, 20, 30, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.18);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    /* 页面切换修复 */
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }
    .page.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* 首页样式 */
    #page-home {
      gap: 24px;
      text-align: center;
    }
    .main-title {
      font-size: 48px;
      color: #d4af37;
      font-weight: bold;
      letter-spacing: 4px;
    }
    .location-tip {
      font-size: 16px;
      color: #c9c9d8;
    }
    .gold-btn {
      padding: 14px 48px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #b8860b, #d4af37);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
      pointer-events: auto !important;
      position: relative;
      z-index: 10;
    }
    .gold-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 22px rgba(212, 175, 55, 0.55);
    }
    /* 登录页 */
    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
    }
    .login-title {
      text-align: center;
      font-size: 26px;
      color: #d4af37;
      margin-bottom: 30px;
    }
    .input-item {
      margin-bottom: 20px;
    }
    .input-item label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
    }
    .input-item input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid rgba(212,175,55,0.2);
      background: rgba(30,30,45,0.6);
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    .input-item input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 8px rgba(212,175,55,0.3);
    }
    /* 凭证管理页面 */
    .manage-wrap {
      width: 100%;
      max-width: 1000px;
      padding: 30px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap:16px;
    }
    .table-box {
      width: 100%;
      border: 1px solid rgba(212,175,55,0.15);
      border-radius: 16px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th,td {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    th {
      background: rgba(212,175,55,0.12);
      color: #d4af37;
    }
    /* 全局弹窗遮罩 */
    .mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .mask.show {
      display: flex;
    }
    .modal {
      width: 100%;
      max-width: 480px;
      padding: 30px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 22px;
      color: #d4af37;
      margin-bottom: 24px;
      text-align: center;
    }
    .modal-btns {
      display: flex;
      gap: 16px;
      margin-top: 30px;
    }
    .modal-btns button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    .btn-cancel {
      background: #333;
      color: #fff;
    }
    /* 转盘弹窗 */
    .turntable-box {
      text-align: center;
    }
    #turntable {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      margin: 0 auto 20px;
      position: relative;
      overflow: hidden;
      border: 6px solid #d4af37;
      transition: transform 4s cubic-bezier(0.2,0,0.2,1);
    }
    .turntable-item {
      width: 50%;
      height: 50%;
      position: absolute;
      top: 0;
      left: 50%;
      transform-origin: bottom left;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #000;
      font-weight: bold;
    }
    /* 支付弹窗图片 */
    .pay-img {
      width: 260px;
      margin: 20px auto;
      border-radius: 12px;
      display: block;
    }
    /* 上传图片预览 */
    #imgPreview {
      width: 100%;
      max-height: 200px;
      border-radius: 10px;
      margin:10px 0;
      display: none;
    }
  </style>
</head>
<body>
  <!-- 首页 -->
  <div id="page-home" class="page active">
    <h1 class="main-title">玉国国际金融公司全球通</h1>
    <p class="location-tip">您当前所在的位置为澳门</p>
    <button class="gold-btn" id="loginBtn">登录</button>
  </div>

  <!-- 登录页 -->
  <div id="page-login" class="page">
    <div class="glass-card login-box">
      <h2 class="login-title">账号登录</h2>
      <div class="input-item">
        <label>账号</label>
        <input id="user-acc" placeholder="请输入账号">
      </div>
      <div class="input-item">
        <label>密码</label>
        <input id="user-pwd" type="password" placeholder="请输入密码">
      </div>
      <button class="gold-btn" style="width:100%" id="submitLoginBtn">确认登录</button>
    </div>
  </div>

  <!-- 凭证管理页 -->
  <div id="page-manage" class="page">
    <div class="glass-card manage-wrap">
      <div class="top-bar">
        <h2 style="color:#d4af37">凭证记录列表</h2>
        <button class="gold-btn" id="addRecordBtn">增加凭证</button>
      </div>
      <div class="table-box">
        <table id="record-table">
          <thead>
            <tr>
              <th>店铺名称</th>
              <th>付款金额</th>
              <th>折扣</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 新增凭证弹窗（新增拍照上传） -->
  <div id="mask-add" class="mask">
    <div class="glass-card modal">
      <h3 class="modal-title">新增凭证</h3>
      <div class="input-item">
        <label>店铺名称</label>
        <input id="shop-name" placeholder="输入店铺名称">
      </div>
      <div class="input-item">
        <label>付款金额（必填）</label>
        <input id="pay-money" placeholder="必须填写金额才可提交">
      </div>
      <div class="input-item">
        <label>商品照片（必须上传）</label>
        <input type="file" accept="image/*" capture="environment" id="uploadImg">
        <img id="imgPreview" alt="图片预览">
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" id="closeAddMask">取消</button>
        <button class="gold-btn" id="submitRecordBtn">确认提交</button>
      </div>
    </div>
  </div>

  <!-- 抽奖转盘弹窗 -->
  <div id="mask-turntable" class="mask">
    <div class="glass-card modal turntable-box">
      <h3 class="modal-title">幸运抽奖</h3>
      <div id="turntable"></div>
      <p id="lottery-result" style="font-size:20px;color:#d4af37;margin:15px 0"></p>
      <button class="gold-btn" id="closeTurntableMask">确定</button>
    </div>
  </div>

  <!-- 微信支付弹窗 -->
  <div id="mask-pay" class="mask">
    <div class="glass-card modal" style="text-align:center">
      <h3 class="modal-title">微信支付</h3>
      <img class="pay-img" id="wx-img" src="./wxpay.png" alt="微信收款码">
      <p>扫码完成支付</p>
      <button class="gold-btn" style="margin-top:20px" id="closePayMask">关闭</button>
    </div>
  </div>

  <script>
    // 页面切换
    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
      document.getElementById(pageId).classList.add('active')
    }

    // 关闭弹窗
    function closeMask(maskId) {
      document.getElementById(maskId).classList.remove('show')
    }
    // 打开弹窗
    function openMask(maskId) {
      document.getElementById(maskId).classList.add('show')
    }

    // 登录校验：固定账号谭绣云，密码484142
    function login() {
      let acc = document.getElementById('user-acc').value.trim()
      let pwd = document.getElementById('user-pwd').value.trim()
      if(acc !== "谭绣云" || pwd !== "484142"){
        alert("账号或密码错误！正确账号：谭绣云，密码：484142")
        return
      }
      switchPage('page-manage')
    }

    // 打开新增凭证弹窗
    function openAddModal() {
      openMask('mask-add')
      document.getElementById('shop-name').value = ''
      document.getElementById('pay-money').value = ''
      document.getElementById('uploadImg').value = ''
      document.getElementById('imgPreview').style.display = 'none'
    }

    // 凭证数据存储
    let recordList = []
    let nowEditIndex = null
    let hasUploadPic = false

    // 图片上传预览
    document.addEventListener('change', function(e){
      if(e.target.id === "uploadImg"){
        const file = e.target.files[0]
        if(file){
          const reader = new FileReader()
          reader.onload = function(ev){
            document.getElementById('imgPreview').src = ev.target.result
            document.getElementById('imgPreview').style.display = 'block'
            hasUploadPic = true
          }
          reader.readAsDataURL(file)
        }else{
          hasUploadPic = false
        }
      }
    })
